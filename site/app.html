<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beatloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #eceaf4; --folha: #f7f6fb; --tinta: #1a1838; --tinta-2: #5b5978; --linha: rgba(26, 24, 56, .16);
  --palco: #0f0e26; --esq: #f23d5e; --dir: #2e86ff; --ok: #178f63; --alerta: #b4540a;
  --titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --texto: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 400 16px/1.5 var(--texto); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--dir); outline-offset: 2px; }

.casca { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: 100%; }
.lado { padding: 28px 28px 40px; border-right: 1px solid var(--linha); display: flex; flex-direction: column; gap: 28px; }
.principal { padding: 28px clamp(16px, 3vw, 40px) 40px; min-width: 0; }

.marca { font: 800 15px/1 var(--titulo); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.marca i { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, var(--esq) 0 50%, var(--dir) 50% 100%); }
h1 { font: 700 clamp(30px, 3.2vw, 40px)/1.02 var(--titulo); letter-spacing: -.035em; margin: 18px 0 0; }
.lado p.sub { margin: 10px 0 0; color: var(--tinta-2); max-width: 30ch; }

form { display: grid; gap: 10px; }
.campo { width: 100%; padding: 14px 14px; border: 1.5px solid var(--tinta); border-radius: 10px; background: var(--folha); }
.campo::placeholder { color: var(--tinta-2); }
.arquivo { display: flex; align-items: center; gap: 8px; color: var(--tinta-2); font-size: 14px; }
.arquivo button { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--tinta); }
.arquivo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.opc { font-size: 14px; color: var(--tinta-2); }
details.opc summary { cursor: pointer; }
details.opc div { display: grid; gap: 8px; margin-top: 8px; }
details.opc .campo { padding: 10px 12px; border-width: 1px; border-color: var(--linha); }
.previa { display: grid; grid-template-columns: 72px 1fr; gap: 10px 12px; align-items: start; }
.previa img, .previa .sem-capa { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; background: linear-gradient(135deg, #1e3a8a, #db2777); }
.previa .campos { display: grid; gap: 6px; min-width: 0; }
.previa .campo { padding: 8px 10px; border-width: 1px; border-color: var(--linha); }
.previa small { grid-column: 1 / -1; color: var(--tinta-2); font-size: 13px; }
fieldset.escolha { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
fieldset.escolha legend { padding: 0; color: var(--tinta-2); margin-bottom: 4px; }
fieldset.escolha label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.densidade { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; color: var(--tinta-2); }
.densidade input { grid-column: 1 / -1; width: 100%; accent-color: var(--tinta); }
.ficha { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; margin-top: 22px; }
.ficha img { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--palco); }
.ficha h2 { font-size: 24px; margin: 0; }
.ficha p { margin: 2px 0 0; color: var(--tinta-2); overflow-wrap: anywhere; }
.ficha .mini { display: flex; gap: 14px; margin-top: 6px; }
.ficha .mini button { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; color: var(--tinta); }
.acao { padding: 14px 18px; border: 0; border-radius: 10px; background: var(--tinta); color: #fff; font: 600 16px var(--texto); cursor: pointer; }
.acao:hover { background: #2a2760; }
.acao:disabled { opacity: .5; cursor: default; }
.erro { color: #b3122f; font-size: 14px; margin: 0; }

.trabalho { border-left: 3px solid var(--dir); padding: 2px 0 2px 12px; font-size: 14px; }
.trabalho.erro-t { border-color: var(--esq); }
.trabalho.pronto { border-color: var(--ok); }
.trabalho b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trabalho span { color: var(--tinta-2); }
@keyframes pulso { 50% { opacity: .35; } }
.trabalho.rodando span::after { content: " ●"; color: var(--dir); animation: pulso 1.2s infinite; }

h2 { font: 700 18px/1.2 var(--titulo); letter-spacing: -.02em; margin: 0 0 8px; }
.mapas { list-style: none; margin: 0; padding: 0; }
.mapas li { border-top: 1px solid var(--linha); }
.mapas button { width: 100%; text-align: left; background: none; border: 0; padding: 11px 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; border-radius: 6px; }
.mapas button:hover { background: rgba(26, 24, 56, .06); }
.mapas button[aria-current="true"] { background: var(--tinta); color: #fff; }
.mapas .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mapas .d { grid-column: 1; font-size: 13px; opacity: .7; }
.mapas .s { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; font-weight: 600; }
.mapas .s.ok { color: var(--ok); } .mapas .s.nao { color: var(--alerta); }
.mapas button[aria-current="true"] .s { color: #fff; }
.vazio { color: var(--tinta-2); font-size: 14px; }

.palco { position: relative; background: var(--palco); border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 62vh; width: 100%; }
.palco iframe { width: 100%; height: 100%; display: block; border: 0; }
.palco .convite { position: absolute; inset: 0; display: grid; place-items: center; color: #c9c7e6; font: 600 clamp(18px, 2.2vw, 26px) var(--titulo); letter-spacing: -.02em; text-align: center; padding: 24px; pointer-events: none; }

.controles { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.controles { color: var(--tinta-2); font-size: 14px; }
.difs { display: flex; border: 1.5px solid var(--tinta); border-radius: 999px; overflow: hidden; }
.difs button { border: 0; background: none; padding: 7px 14px; cursor: pointer; font: 500 14px var(--texto); color: var(--tinta); }
.difs button[aria-pressed="true"] { background: var(--tinta); color: #fff; }

.resumo { margin-top: 26px; display: grid; grid-template-columns: 1fr auto; gap: 18px 28px; align-items: start; }
.veredito { font: 700 22px/1.15 var(--titulo); letter-spacing: -.025em; margin: 0; }
.veredito.ok { color: var(--ok); } .veredito.nao { color: var(--alerta); }
.numeros { margin: 8px 0 0; color: var(--tinta-2); max-width: 62ch; }
.botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.sec { padding: 12px 16px; border: 1.5px solid var(--tinta); border-radius: 10px; background: none; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--tinta); }
.sec:hover { background: rgba(26, 24, 56, .06); }
.quest-saida { grid-column: 1 / -1; font-size: 14px; white-space: pre-wrap; margin: 0; padding: 12px 14px; background: var(--folha); border-radius: 10px; border: 1px solid var(--linha); }
details.rel { grid-column: 1 / -1; }
details.rel summary { cursor: pointer; font-weight: 600; }
details.rel pre { font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px; overflow: auto; max-height: 420px; }
[hidden] { display: none !important; }

@media (max-width: 860px) {
  .casca { grid-template-columns: 1fr; }
  .lado { border-right: 0; border-bottom: 1px solid var(--linha); }
  .resumo { grid-template-columns: 1fr; } .botoes { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .trabalho.rodando span::after { animation: none; } }
.marca { display: flex; align-items: center; }
.q { margin-left: auto; font: 600 12px var(--texto); } .q.ok { color: var(--ok); } .q.nao { color: var(--tinta-2); }
.q:empty + .lingua { margin-left: auto; }
.painel { border: 0; border-radius: 18px; padding: 0; width: min(680px, 94vw); max-height: 92vh; background: var(--folha); color: var(--tinta); }
.painel::backdrop { background: rgba(15, 14, 38, .78); }
.painel .dentro { padding: 28px; display: grid; gap: 24px; }
.painel .passo { margin: 0; color: var(--tinta-2); font-size: 14px; }
.painel header h2 { font-size: 26px; margin: 0; }
.painel h3 { font: 700 16px var(--titulo); margin: 0 0 6px; }
.painel section p { margin: 0 0 10px; }
.painel[data-passo] section { display: none; }
.painel[data-passo="1"] section[data-p="1"], .painel[data-passo="2"] section[data-p="2"], .painel[data-passo="3"] section[data-p="3"] { display: block; }
.painel .linha { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.painel .linha .campo { flex: 1; min-width: 200px; padding: 10px 12px; }
.painel .difs { display: inline-flex; }
.itens { list-style: none; margin: 0 0 12px; padding: 0; }
.itens li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linha); }
.itens .d { grid-column: 1; font-size: 13px; color: var(--tinta-2); }
.itens .s { grid-column: 2; grid-row: 1 / span 2; font-size: 13px; font-weight: 600; text-align: right; }
.itens .s.ok { color: var(--ok); }
.itens .s .sec, .painel .mini-b { padding: 7px 12px; font-size: 14px; }
.itens .erro { grid-column: 1 / -1; }
.itens progress { width: 110px; vertical-align: middle; accent-color: var(--dir); }
.lingua { margin-left: 0; border: 1.5px solid var(--tinta); border-radius: 999px; background: none; padding: 3px 10px; font: 600 12px var(--texto); cursor: pointer; color: var(--tinta); }
</style>
</head>
<body>
<div class="casca">
  <aside class="lado">
    <header>
      <div class="marca"><i></i>Beatloom <span class="q" id="q-estado"></span><button type="button" id="lingua" class="lingua"></button><button type="button" id="config" class="lingua" data-t="config"></button></div>
      <h1 data-t="titulo"></h1>
      <p class="sub" data-t="sub"></p>
    </header>

    <form id="form">
      <input class="campo" id="link" type="url" inputmode="url" data-tp="link" autocomplete="off">
      <div class="arquivo"><span id="arq-nome"></span> <button type="button" id="arq-btn"></button>
        <input type="file" id="arq" accept="audio/*,.egg" hidden></div>
      <div class="previa" id="previa" hidden>
        <img id="p-capa" alt=""><div class="sem-capa" id="p-sem" hidden></div>
        <div class="campos"><input class="campo" id="nome" data-tp="nome"><input class="campo" id="artista" data-tp="artista"></div>
        <small id="p-info"></small>
      </div>
      <fieldset class="escolha" id="escolha"><legend data-t="quais"></legend></fieldset>
      <label class="densidade"><span data-t="densidade"></span><span id="dens-v"></span>
        <input type="range" id="dens" min="0.8" max="1.3" step="0.05" value="1"></label>
      <button class="acao" id="gerar" data-t="gerar"></button>
      <p class="erro" id="erro" role="alert" hidden></p>
    </form>

    <div id="trabalhos" aria-live="polite"></div>

    <section>
      <h2 data-t="mapas"></h2>
      <ul class="mapas" id="mapas"></ul>
      <p class="vazio" id="sem-mapas" data-t="sem_mapas" hidden></p>
    </section>
  </aside>

  <main class="principal">
    <div class="palco">
      <iframe id="visor" title="ArcViewer" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
      <div class="convite" id="convite" data-t="convite"></div>
    </div>
    <p class="controles" id="controles" hidden><span class="difs" id="difs" role="group"></span><button type="button" class="sec" id="regerar" data-t="regerar" style="padding:6px 12px"></button><span data-t="visor"></span>
      <a id="fora" target="_blank" rel="noopener" data-t="cheia"></a></p>
    <section class="ficha" id="ficha" hidden>
      <img id="f-capa" alt="">
      <div><h2 id="f-nome"></h2><p id="f-info"></p>
        <div class="mini"><button type="button" id="renomear" data-t="renomear"></button><button type="button" id="apagar" data-t="apagar"></button></div></div>
    </section>
    <section class="resumo" id="resumo" hidden>
      <div><p class="veredito" id="veredito"></p><p class="numeros" id="numeros"></p></div>
      <div class="botoes">
        <a class="sec" id="baixar" data-t="baixar"></a>
        <button class="sec" id="q-apagar" data-t="q_apagar" hidden></button>
        <button class="acao" id="quest" hidden></button>
      </div>
      <pre class="quest-saida" id="quest-saida" hidden></pre>
      <details class="rel"><summary data-t="rel"></summary><pre id="rel"></pre></details>
    </section>
  </main>
</div>

<dialog class="painel" id="painel"><div class="dentro">
  <header><p class="passo" id="p-passo"></p><h2 id="p-titulo"></h2></header>
  <section data-p="1"><h3 data-t="s_lingua"></h3>
    <div class="difs" id="p-linguas" role="group"><button type="button" data-l="pt">Português</button><button type="button" data-l="en">English</button></div></section>
  <section data-p="2"><h3 data-t="s_itens"></h3><p class="vazio" data-t="s_itens_sub"></p>
    <ul class="itens" id="itens"></ul><button type="button" class="sec mini-b" id="p-tudo" data-t="instalar_tudo"></button></section>
  <section data-p="3"><h3 data-t="s_quest"></h3><p class="vazio" data-t="s_quest_sub"></p><p id="q-texto" aria-live="polite"></p>
    <div class="linha"><button type="button" class="sec mini-b" id="q-parear" data-t="q_parear"></button></div>
    <div class="linha"><input class="campo" id="q-ip" inputmode="decimal" autocomplete="off" data-tp="q_ip"><button type="button" class="sec mini-b" id="q-testar" data-t="q_testar"></button></div>
    <p class="erro" id="q-erro" role="alert" hidden></p></section>
  <section><h3 data-t="s_padrao"></h3><fieldset class="escolha" id="c-difs"><legend data-t="quais"></legend></fieldset>
    <label class="densidade" style="margin-top:10px"><span data-t="densidade"></span><span id="c-dens-v"></span>
      <input type="range" id="c-dens" min="0.8" max="1.3" step="0.05" value="1"></label></section>
  <section><h3 data-t="s_cache"></h3><p id="c-cache"></p><button type="button" class="sec mini-b" id="c-limpar" data-t="limpar"></button>
    <p class="vazio" id="c-torch" style="margin-top:10px"></p></section>
  <footer class="botoes"><button type="button" class="sec" id="p-voltar" data-t="voltar"></button><button type="button" class="acao" id="p-seguir"></button></footer>
</div></dialog>

<script>

  method: "POST", headers: { "X-Automapper": "1", ...(cru ? {} : { "Content-Type": "application/json" }) }, body: cru ? corpo : JSON.stringify(corpo),
}).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.erro ? erroT(j.erro) : t("erro")); return j; });

let lingua = navigator.language.startsWith("pt") ? "pt" : "en";  // ate o beatloom.json dizer outra coisa
const t = (k) => T[lingua][k] || k;
const erroT = (c) => { const [k, resto] = String(c).split("|"); const m = T[lingua][k === "link" ? "link_ruim" : k]; return m ? m + (resto ? " " + resto : "") : c; };
function traduzir() {
  document.documentElement.lang = lingua === "pt" ? "pt-BR" : "en";
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll("[data-tp]")) { e.placeholder = t(e.dataset.tp); e.setAttribute("aria-label", t(e.dataset.tp)); }
  $("lingua").textContent = lingua === "pt" ? "English" : "Português";
  $("arq-nome").textContent = arquivo ? arquivo.name : t("ou"); $("arq-btn").textContent = t(arquivo ? "trocar_arq" : "escolha");
  for (const b of $("p-linguas").children) b.setAttribute("aria-pressed", b.dataset.l === lingua);
  $("dens").oninput(); $("c-dens").oninput(); atualizar.chave = null;
  if (mapa) pintar();
  if ($("painel").open) { botoes(); verPreparo(); verQuest(); verConfig(); }
}
function mudarLingua(l) { lingua = l; salvar({ lingua }); traduzir(); atualizar(); }
$("lingua").onclick = () => mudarLingua(lingua === "pt" ? "en" : "pt");
for (const b of $("p-linguas").children) b.onclick = () => mudarLingua(b.dataset.l);

// ---------- gerar
let arquivo = null, subido = null, extra = {};
$("arq-btn").onclick = () => $("arq").click();
$("dens").oninput = () => { const v = +$("dens").value; $("dens-v").textContent = t(v < 0.98 ? "leve" : v > 1.02 ? "cheio" : "normal") + " (×" + v.toFixed(2) + ")"; };
// previa: mostra capa, nome e artista antes de gerar, para a pessoa corrigir
function previa(d, capa, info) {
  extra = { album: d.album, ano: d.ano };
  $("previa").hidden = false; $("nome").value = d.nome || ""; $("artista").value = d.artista || "";
  $("p-capa").hidden = !capa; $("p-sem").hidden = !!capa; if (capa) $("p-capa").src = capa;
  $("p-info").textContent = [d.album, d.ano, info, t("confira")].filter(Boolean).join(" · ");
}
function semPrevia() { $("previa").hidden = true; $("nome").value = ""; $("artista").value = ""; extra = {}; }
let ultimoLink = "";
async function verLink() {
  const link = $("link").value.trim();
  if (link === ultimoLink) return;
  ultimoLink = link;
  if (!/^https?:\/\/\S+$/.test(link)) return semPrevia();
  $("previa").hidden = false; $("p-info").textContent = t("procurando");
  try { const d = await api("/api/previa", { link }); if ($("link").value.trim() === link) previa(d, d.capa, ""); }
  catch (x) { if ($("link").value.trim() === link) { semPrevia(); $("erro").textContent = x.message; $("erro").hidden = false; } }
}
$("link").onchange = verLink;
$("link").onpaste = () => setTimeout(verLink, 0);
$("arq").onchange = async () => {
  arquivo = $("arq").files[0] || null; subido = null;
  $("arq-nome").textContent = arquivo ? arquivo.name : t("ou"); $("arq-btn").textContent = t(arquivo ? "trocar_arq" : "escolha");
  if (!arquivo) return semPrevia();
  $("link").value = ""; ultimoLink = ""; $("erro").hidden = true;
  try {
    subido = await api("/api/arquivo?nome=" + encodeURIComponent(arquivo.name), arquivo, true);
    const capa = "/api/capa?arquivo=" + encodeURIComponent(subido.base) + "&v=" + Date.now();
    const tem = (await fetch(capa)).ok;
    previa(subido, tem ? capa : null, t(tem ? "capa_arq" : "capa_gen"));
  } catch (x) { $("erro").textContent = x.message; $("erro").hidden = false; }
};
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const erro = $("erro"); erro.hidden = true; $("gerar").disabled = true;
  try {
    const link = $("link").value.trim();
    const difs = [...$("escolha").querySelectorAll("input:checked")].map((c) => c.value);
    if (!difs.length) throw new Error(t("sem_dif"));
    if (!link && arquivo && !subido) subido = await api("/api/arquivo?nome=" + encodeURIComponent(arquivo.name), arquivo, true);
    await api("/api/gerar", { link, arquivo: link ? null : subido && subido.arquivo, nome: $("nome").value, artista: $("artista").value, ...extra, difs, densidade: +$("dens").value });
    $("link").value = ""; ultimoLink = ""; $("arq").value = ""; arquivo = subido = null; semPrevia();
    $("arq-nome").textContent = t("ou"); $("arq-btn").textContent = t("escolha");
    atualizar();
  } catch (x) { erro.textContent = x.message; erro.hidden = false; }
  $("gerar").disabled = false;
};

// ---------- lista e trabalhos
let atual = null, vistos = new Set(), primeira = true;
async function atualizar() {
  const e = await api("/api/estado");
  $("trabalhos").innerHTML = "";
  let ativo = false;
  for (const tr of e.trabalhos.slice().reverse()) {
    if (tr.estado === "pronto" && !primeira && !vistos.has(tr.id) && tr.zip) { vistos.add(tr.id); abrir(tr.zip); }
    if (tr.estado === "pronto") { vistos.add(tr.id); continue; }
    ativo = ativo || tr.estado !== "erro";
    const d = document.createElement("div");
    d.className = "trabalho " + (tr.estado === "erro" ? "erro-t" : tr.estado === "rodando" ? "rodando" : "");
    const b = document.createElement("b"); b.textContent = tr.titulo;
    const s = document.createElement("span");
    const [passo, qual] = (tr.passos.at(-1) || "comecando").split("|");  // "golpes|Hard (2/4)"
    s.textContent = tr.estado === "erro" ? erroT(tr.erro) : tr.estado === "na fila" ? t("fila") : t(passo) + (qual ? " " + qual.replace("ExpertPlus", "Expert+") : "");
    d.append(b, s); $("trabalhos").append(d);
  }
  primeira = false;
  const ul = $("mapas"), chave = JSON.stringify([e.mapas, atual, noQuest.mapas]);
  $("sem-mapas").hidden = e.mapas.length > 0;
  for (const m of chave === atualizar.chave ? [] : e.mapas) {  // so redesenha a lista quando ela muda (nao rouba o foco)
    if (m === e.mapas[0]) ul.innerHTML = "";
    const li = document.createElement("li"), b = document.createElement("button");
    b.setAttribute("aria-current", m.zip === atual);
    b.innerHTML = '<span class="n"></span><span class="d"></span><span class="s"></span>';
    b.children[0].textContent = m.nome;
    b.children[1].textContent = [m.artista, m.sub, Math.round(m.bpm) + " BPM", noQuest.mapas[m.zip] && t(noQuest.mapas[m.zip] === "ok" ? "no_quest" : "q_velho")].filter(Boolean).join(", ");
    b.children[2].textContent = !m.conferido ? "" : t(m.ok ? "metas_ok" : "ver_rel");
    b.children[2].className = "s " + (m.ok ? "ok" : "nao");
    b.onclick = () => abrir(m.zip);
    li.append(b); ul.append(li);
  }
  if (!e.mapas.length) ul.innerHTML = "";
  atualizar.chave = chave;
  temVisor = e.visor;
  for (const [id, aoMudar] of [["escolha", null], ["c-difs", guardarPadrao]]) if (!$(id).querySelector("input")) for (const d of e.difs) {  // uma caixa por dificuldade
    const l = document.createElement("label"), c = document.createElement("input");
    c.type = "checkbox"; c.value = d; c.checked = cfg.difs.includes(d); c.onchange = aoMudar; l.append(c, NOMES[d] || d); $(id).append(l);
  }
  clearTimeout(atualizar.t);
  atualizar.t = setTimeout(atualizar, ativo ? 1200 : 6000);
}

// ---------- previa: copia local do ArcViewer servida por este app; noProxy = ler o zip direto deste PC, nada sobe para a internet
async function abrir(zip) {
  atual = zip;
  mapa = await api("/api/mapa?zip=" + encodeURIComponent(zip));
  const box = $("difs"); box.innerHTML = "";
  for (const d of mapa.difs) {
    const b = document.createElement("button"); b.textContent = NOMES[d.nome] || d.nome; b.dataset.n = d.nome;
    b.onclick = () => verDif(d.nome); box.append(b);
  }
  verDif(mapa.difs.some((d) => d.nome === dif) ? dif : mapa.difs.some((d) => d.nome === "Expert") ? "Expert" : mapa.difs[0].nome);
  $("visor").hidden = !temVisor; $("controles").hidden = !temVisor; $("convite").hidden = temVisor;
  $("resumo").hidden = false; $("ficha").hidden = false; $("quest-saida").hidden = true;
  $("f-capa").src = "/api/capa?zip=" + encodeURIComponent(zip) + "&v=" + Date.now();
  $("baixar").href = "/api/zip?zip=" + encodeURIComponent(zip);
  pintar(); atualizar();
}
let dif = "Expert";
function verDif(nome) {  // trocar de dificuldade recarrega o ArcViewer ja nela (uns segundos)
  dif = nome;
  for (const b of $("difs").children) b.setAttribute("aria-pressed", b.dataset.n === nome);
  const visor = `/arcviewer/?noProxy=true&difficulty=${nome}&url=` + encodeURIComponent(location.origin + "/zip/" + encodeURIComponent(atual));
  if (temVisor) { $("visor").src = visor; $("fora").href = visor; }
}
function pintar() {
  if (!temVisor) $("convite").textContent = t("sem_visor");
  const ok = mapa.relatorio.includes("TODAS AS METAS OK");
  $("veredito").textContent = t(!mapa.relatorio ? "v_sem" : ok ? "v_ok" : "v_nao");
  $("veredito").className = "veredito " + (ok ? "ok" : "nao");
  $("numeros").textContent = mapa.difs.map((d) => `${NOMES[d.nome]}: ${d.notas} ${t("notas")}${d.arcos ? `, ${d.arcos} ${t("arcos")}` : ""}, ${t("vel")} ${d.njs}`).join(". ") + ".";
  $("f-nome").textContent = mapa.nome;
  const info = $("f-info"); info.textContent = [mapa.artista, mapa.album, mapa.ano, Math.round(mapa.bpm) + " BPM"].filter(Boolean).join(" · ");
  if (/^https?:\/\//.test(mapa.link || "")) { const a = document.createElement("a"); a.href = mapa.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("fonte"); info.append(" · ", a); }
  $("rel").textContent = mapa.relatorio || t("sem_rel");
  const la = noQuest.mapas[atual];
  $("quest").hidden = !noQuest.conectado; $("quest").textContent = t(la === "ok" ? "q_de_novo" : la ? "q_atualizar" : "quest"); $("q-apagar").hidden = !la;
}
$("regerar").onclick = async () => {  // so a dificuldade que esta aberta; as outras ficam como estao
  const v = prompt(t("pergunta_dens"), "1"); if (v === null) return;
  const b = $("regerar"); b.disabled = true; b.textContent = t("regerando");
  try { await api("/api/regerar", { zip: atual, dif, densidade: parseFloat(v.replace(",", ".")) || 1 }); await abrir(atual); } catch (x) { alert(x.message); }

};
$("renomear").onclick = async () => {
  const nome = prompt(t("novo_nome"), mapa.nome); if (nome === null) return;
  const artista = prompt(t("novo_artista"), mapa.artista); if (artista === null) return;
  await api("/api/renomear", { zip: atual, nome, artista }); atualizar.chave = null; abrir(atual);
};
$("apagar").onclick = async () => {
  if (!confirm(t("confirma_apagar"))) return;
  await api("/api/apagar", { zip: atual });
  atual = mapa = null; atualizar.chave = null;
  for (const id of ["ficha", "resumo", "controles", "visor"]) $(id).hidden = true;
  $("visor").src = "about:blank"; $("convite").hidden = false; $("convite").textContent = t("convite"); atualizar();
};
$("quest").onclick = async () => {
  if (!atual || !confirm(t("confirma"))) return;
  const s = $("quest-saida"); s.hidden = false; s.textContent = t("mandando"); $("quest").disabled = true;
  try { const r = (await api("/api/quest", { zip: atual })).resultados[atual]; s.textContent = r ? t("falhou") + " " + erroT(r) : t("q_enviado"); } catch (x) { s.textContent = x.message; }
  $("quest").disabled = false; verQuest();
};
$("q-apagar").onclick = async () => {
  if (!confirm(t("q_confirma_apagar"))) return;
  try { await api("/api/quest/apagar", { zip: atual }); } catch (x) { alert(x.message); }
  verQuest();
};

// ---------- primeira vez e configuracao: o mesmo painel. passo 1 a 3 = primeira vez (uma parte por vez); 0 = tudo junto
const ITENS = ["ffmpeg", "node", "padroes", "visor", "adb"];
let cfg = { difs: [] }, noQuest = { mapas: {} }, passo = 0;
const salvar = async (d) => { cfg = { ...cfg, ...(await api("/api/config", d)) }; };
const mb = (n) => Math.round(n / 2 ** 20) + " MB";
async function verPreparo() {
  const p = await api("/api/preparo"), ul = $("itens");
  ul.innerHTML = "";
  for (const i of ITENS) {
    const e = p[i], li = document.createElement("li"), n = document.createElement("b"), d = document.createElement("span"), s = document.createElement("span");
    n.textContent = t("i_" + i) + (e.obrigatorio ? "" : " · " + t("opcional")); d.textContent = t("d_" + i); d.className = "d"; s.className = "s";
    if (e.ok) { s.textContent = t("instalado"); s.classList.add("ok"); }
    else if (e.rodando) {  // barra parada no meio = sem tamanho conhecido
      const b = document.createElement("progress"); if (e.total) { b.max = e.total; b.value = e.feito; }
      s.append(b, " " + (i === "padroes" ? (e.total ? e.feito + " / " + e.total : t("montando")) : e.total ? mb(e.feito) + " / " + mb(e.total) : e.feito ? mb(e.feito) : t("trabalhando")));
    } else {
      const b = document.createElement("button"); b.type = "button"; b.className = "sec"; b.textContent = t("instalar");
      b.onclick = async () => { await api("/api/preparo", { item: i }); verPreparo(); }; s.append(b);
    }
    li.append(n, s, d);
    if (e.erro && !e.ok) { const x = document.createElement("p"); x.className = "erro"; x.textContent = t("falhou") + " " + e.erro; li.append(x); }
    ul.append(li);
  }
  const ativo = ITENS.some((i) => p[i].rodando);
  $("p-tudo").hidden = ativo || ITENS.every((i) => p[i].ok);
  verPreparo.falta = ITENS.some((i) => p[i].obrigatorio && !p[i].ok);
  botoes();
  clearTimeout(verPreparo.t);
  if ($("painel").open) verPreparo.t = setTimeout(verPreparo, ativo ? 1000 : 5000);
}
$("p-tudo").onclick = async () => { await api("/api/preparo", { item: "tudo" }); verPreparo(); };

async function verQuest() {
  clearTimeout(verQuest.t); verQuest.t = setTimeout(verQuest, 15000);
  try { noQuest = await api("/api/quest"); } catch (x) { return; }
  $("q-estado").textContent = noQuest.conectado ? t("q_on") : noQuest.ip ? t("q_off") : "";
  $("q-estado").className = "q " + (noQuest.conectado ? "ok" : "nao");
  $("q-texto").textContent = t(!noQuest.adb ? "q_sem_adb" : noQuest.conectado ? "q_conectado" : noQuest.ip ? "q_nao_responde" : "q_sem_ip") + (noQuest.conectado ? " (" + noQuest.ip + ")" : "");
  if (document.activeElement !== $("q-ip")) $("q-ip").value = noQuest.ip;
  $("q-parear").disabled = $("q-testar").disabled = !noQuest.adb;
  if (mapa) pintar();
  atualizar();
}
async function comQuest(botao, pedido) {  // os dois botoes do Quest: trava, tenta, mostra o erro
  $("q-erro").hidden = true; botao.disabled = true;
  try { await pedido(); } catch (x) { $("q-erro").textContent = x.message; $("q-erro").hidden = false; }
  await verQuest();
}
$("q-parear").onclick = () => comQuest($("q-parear"), () => api("/api/quest/parear", {}));
$("q-testar").onclick = () => comQuest($("q-testar"), async () => {
  const ip = $("q-ip").value.trim(); await salvar({ quest_ip: ip });
  if (cfg.quest_ip !== ip) throw new Error(t("ip_ruim"));
});

async function verConfig() {
  cfg = await api("/api/config");
  $("c-cache").textContent = t("cache_tam").replace("{n}", mb(cfg.cache)); $("c-torch").textContent = t("torch") + " " + cfg.torch;
  $("c-dens").value = cfg.densidade; $("c-dens").oninput();
  for (const c of $("c-difs").querySelectorAll("input")) c.checked = cfg.difs.includes(c.value);
}
async function guardarPadrao() {  // o padrao vale tambem para o formulario que esta aberto
  await salvar({ difs: [...$("c-difs").querySelectorAll("input:checked")].map((c) => c.value), densidade: +$("c-dens").value });
  for (const c of $("escolha").querySelectorAll("input")) c.checked = cfg.difs.includes(c.value);
  $("dens").value = cfg.densidade; $("dens").oninput();
}
$("c-dens").oninput = () => { $("c-dens-v").textContent = "×" + (+$("c-dens").value).toFixed(2); };
$("c-dens").onchange = guardarPadrao;
$("c-limpar").onclick = async () => {
  if (!confirm(t("confirma_limpar"))) return;
  try { await api("/api/cache", {}); } catch (x) { alert(x.message); }
  verConfig();
};

function botoes() {
  const p = $("painel");
  if (passo) p.dataset.passo = passo; else delete p.dataset.passo;
  $("p-passo").textContent = passo ? t("passo").replace("{n}", passo) : "";
  $("p-titulo").textContent = t(passo ? "bemvindo" : "config");
  $("p-voltar").hidden = passo < 2;
  $("p-seguir").textContent = t(!passo ? "fechar" : passo < 3 ? "continuar" : "concluir");
  $("p-seguir").disabled = passo === 2 && !!verPreparo.falta;  // sem os obrigatorios nao da para gerar
}
function abrirPainel(n) {
  passo = n;
  if (!$("painel").open) $("painel").showModal();
  botoes(); verPreparo(); verQuest(); verConfig();
}
$("config").onclick = () => abrirPainel(0);
$("p-voltar").onclick = () => { passo--; botoes(); };
$("p-seguir").onclick = async () => {
  if (passo && passo < 3) { passo++; return botoes(); }
  if (passo) await salvar({ pronto: true });
  $("painel").close();
};
$("painel").oncancel = (e) => { if (passo) e.preventDefault(); };  // Esc nao pula a primeira vez

(async () => {
  cfg = await api("/api/config");
  lingua = cfg.lingua || lingua;
  $("dens").value = cfg.densidade;
  traduzir(); atualizar();
  const p = await api("/api/preparo");
  // primeira vez, ou sumiu algo sem o qual nao da para gerar (ai abre direto na lista de itens)
  if (!cfg.pronto || ITENS.some((i) => p[i].obrigatorio && !p[i].ok)) abrirPainel(cfg.pronto ? 2 : 1);
  else verQuest();
})();
</script>
</body>
</html>
