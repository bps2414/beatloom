<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beatloom</title>
<link rel="stylesheet" href="/site/app.css">
</head>
<body>
<svg hidden>
  <symbol id="i-bpm" viewBox="0 0 16 16"><path d="M1 8h3l2-5 3 10 2-5h4"/></symbol>
  <symbol id="i-tempo" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.5V8l2.5 1.6"/></symbol>
  <symbol id="i-ok" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></symbol>
  <symbol id="i-nao" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-volta" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></symbol>
</svg>

<header class="topo">
  <div class="marca"><i></i>Beatloom</div>
  <button type="button" class="acao" id="novo" data-t="novo_mapa"></button>
  <span class="vao"></span>
  <button type="button" class="quieto q" id="q-estado"></button>
  <button type="button" class="quieto" id="lingua"></button>
  <button type="button" class="quieto" id="config" data-t="config"></button>
</header>

<div class="casca">
  <aside class="biblioteca" data-ta="mapas">
    <div id="trabalhos" aria-live="polite"></div>
    <ul class="mapas" id="mapas"></ul>
    <p class="fraco" id="sem-mapas" data-t="sem_mapas" hidden></p>
    <div class="lote" id="lote" hidden><span id="lote-n"></span>
      <button type="button" class="quieto" id="lote-limpar" data-t="cancelar"></button><button type="button" class="acao" id="lote-enviar" data-t="quest"></button></div>
  </aside>

  <main class="detalhe">
    <div class="chamada" id="vazio"><h1 id="vz-titulo"></h1><p id="vz-sub"></p><button type="button" class="acao" id="vz-novo" data-t="novo_mapa"></button></div>
    <article id="aberto" hidden>
      <button type="button" class="quieto voltar" id="voltar"><svg class="ic"><use href="#i-volta"/></svg><span data-t="mapas"></span></button>
      <header class="ficha"><img id="f-capa" alt="">
        <div><h1 id="f-nome"></h1><p class="artista" id="f-artista"></p><p class="dados" id="f-info"></p></div></header>
      <div class="difs" id="difs" role="group" data-ta="quais"></div>
      <div class="palco">
        <iframe id="visor" title="ArcViewer" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
        <div class="cartaz" id="sem-visor" hidden><p data-t="sem_visor"></p><button type="button" class="acao" id="instalar-visor" data-t="instalar_visor"></button>
          <p id="visor-andamento" hidden><progress id="visor-barra"></progress> <span id="visor-quanto"></span></p></div>
      </div>
      <p class="fraco dica" id="dica"><span data-t="visor_dica"></span> <a id="fora" target="_blank" rel="noopener" data-t="cheia"></a></p>
      <dl class="numeros" id="numeros"></dl>
      <section class="conf">
        <h2 class="veredito" id="veredito"></h2>
        <ul class="metas" id="metas"></ul>
        <details id="tec-caixa"><summary data-t="tecnico"></summary><dl class="tecnico" id="tecnico"></dl></details>
      </section>
      <div class="acoes">
        <button type="button" class="acao" id="quest" hidden></button>
        <a class="sec" id="baixar" data-t="baixar"></a>
        <button type="button" class="sec" id="regerar" data-t="regerar"></button>
        <span class="vao"></span>
        <button type="button" class="quieto" id="renomear" data-t="renomear"></button>
        <button type="button" class="quieto" id="q-apagar" data-t="q_apagar" hidden></button>
        <button type="button" class="quieto" id="apagar" data-t="apagar"></button>
      </div>
    </article>
  </main>
</div>

<template id="m-linha"><li class="linha">
  <input type="checkbox" class="marcar">
  <button type="button" class="abre"><img class="capa" alt="" loading="lazy"><span class="n"></span><span class="a"></span><span class="tags"></span>
    <span class="lado"><span><b class="bpm"></b><svg class="ic"><use href="#i-bpm"/></svg></span><span><b class="dur"></b><svg class="ic"><use href="#i-tempo"/></svg></span></span></button>
</li></template>

<dialog class="caixa" id="d-novo"><form id="form">
  <h2 data-t="novo_mapa"></h2>
  <input class="campo" id="link" type="url" inputmode="url" data-tp="link" autocomplete="off">
  <button type="button" class="solta" id="solta"><b id="arq-nome"></b><span id="arq-dica"></span></button>
  <input type="file" id="arq" accept="audio/*,.egg" hidden>
  <div class="previa" id="previa" hidden>
    <img id="p-capa" alt=""><div class="sem-capa" id="p-sem" hidden></div>
    <div class="campos"><input class="campo" id="nome" data-tp="nome"><input class="campo" id="artista" data-tp="artista"></div>
    <small class="fraco" id="p-info"></small>
  </div>
  <fieldset><legend data-t="quais"></legend><div class="difs" id="escolha"></div></fieldset>
  <label class="densidade"><span data-t="densidade"></span><span id="dens-v"></span>
    <input type="range" id="dens" min="0.8" max="1.3" step="0.05" value="1"></label>
  <p class="erro" id="erro" role="alert" hidden></p>
  <footer><button type="button" class="quieto" data-fecha data-t="cancelar"></button><button class="acao" id="gerar" data-t="gerar"></button></footer>
</form></dialog>

<dialog class="caixa" id="d-nome"><form method="dialog">
  <h2 data-t="renomear"></h2>
  <label class="rotulo"><span data-t="nome"></span><input class="campo" id="n-nome" required></label>
  <label class="rotulo"><span data-t="artista"></span><input class="campo" id="n-artista"></label>
  <footer><button type="button" class="quieto" data-fecha data-t="cancelar"></button><button class="acao" value="sim" data-t="salvar"></button></footer>
</form></dialog>

<dialog class="caixa" id="d-regerar"><form method="dialog">
  <h2 id="r-titulo"></h2><p class="fraco" data-t="regerar_sub"></p>
  <label class="densidade"><span data-t="densidade"></span><span id="r-dens-v"></span>
    <input type="range" id="r-dens" min="0.8" max="1.3" step="0.05" value="1"></label>
  <footer><button type="button" class="quieto" data-fecha data-t="cancelar"></button><button class="acao" value="sim" data-t="regerar_ir"></button></footer>
</form></dialog>

<dialog class="caixa" id="d-confirma"><form method="dialog">
  <p id="cf-texto"></p>
  <footer><button type="button" class="quieto" data-fecha data-t="cancelar"></button><button class="acao" id="cf-sim" value="sim"></button></footer>
</form></dialog>

<dialog class="caixa painel" id="painel">
  <header><p class="fraco" id="p-passo"></p><h2 id="p-titulo"></h2></header>
  <section data-p="1"><h3 data-t="s_lingua"></h3>
    <div class="difs" id="p-linguas" role="group"><button type="button" class="dif" data-l="pt">Português</button><button type="button" class="dif" data-l="en">English</button></div></section>
  <section data-p="2"><h3 data-t="s_itens"></h3><p class="fraco" data-t="s_itens_sub"></p>
    <ul class="itens" id="itens"></ul><button type="button" class="acao" id="p-tudo" data-t="instalar_tudo"></button></section>
  <section data-p="3" id="s-quest"><h3 data-t="s_quest"></h3><p class="fraco" data-t="s_quest_sub"></p><p id="q-texto" aria-live="polite"></p>
    <div class="fila"><button type="button" class="sec" id="q-parear" data-t="q_parear"></button></div>
    <div class="fila"><input class="campo" id="q-ip" inputmode="decimal" autocomplete="off" data-tp="q_ip"><button type="button" class="sec" id="q-testar" data-t="q_testar"></button></div>
    <p class="erro" id="q-erro" role="alert" hidden></p></section>
  <section><h3 data-t="s_padrao"></h3><fieldset><legend data-t="quais"></legend><div class="difs" id="c-difs"></div></fieldset>
    <label class="densidade"><span data-t="densidade"></span><span id="c-dens-v"></span>
      <input type="range" id="c-dens" min="0.8" max="1.3" step="0.05" value="1"></label></section>
  <section><h3 data-t="s_cache"></h3><p id="c-cache"></p><button type="button" class="sec" id="c-limpar" data-t="limpar"></button>
    <p class="fraco" id="c-torch"></p></section>
  <footer><button type="button" class="quieto" id="p-voltar" data-t="voltar"></button><button type="button" class="acao" id="p-seguir"></button></footer>
</dialog>

<div id="avisos" popover="manual" aria-live="polite"></div>
<script type="module" src="/site/app.js"></script>
</body>
</html>
